{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Log in</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="rounded-lg bg-red-100 text-red-800 px-4 py-3 text-sm">{{ form.non_field_errors|striptags }}</div>
        {% endif %}
        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}" autofocus required
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}" required
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full rounded-lg bg-indigo-600 px-6 py-3 text-white font-semibold hover:bg-indigo-700">Log in</button>
    </form>
    <p class="mt-6 text-sm text-center text-gray-500">
        New here? <a href="{% url 'accounts:register' %}" class="text-indigo-600 hover:underline">Create an account</a>
    </p>
</div>
{% endblock %}
